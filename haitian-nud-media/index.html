    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #171822 0%, #0a0b12 70%);
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }

      #app-preloader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .preloader-glow-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preloader-glow {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(220, 38, 38, 0.45) 0%, rgba(220, 38, 38, 0) 70%);
        animation: preloader-pulse 2s ease-in-out infinite;
      }

      .preloader-logo {
        position: relative;
        width: 86px;
        height: 86px;
        border-radius: 20px;
        object-fit: cover;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(220, 38, 38, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.1);
        animation: preloader-zoom 2s ease-in-out infinite alternate;
      }

      .preloader-spinner-ring {
        position: absolute;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #ef4444;
        border-right-color: rgba(239, 68, 68, 0.3);
        animation: preloader-spin 1.1s linear infinite;
      }

      .preloader-text {
        margin-top: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #f3f4f6;
      }

      .preloader-bar-bg {
        margin-top: 14px;
        width: 130px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .preloader-bar-inner {
        position: absolute;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #dc2626, #f87171, #dc2626);
        border-radius: 9999px;
        animation: preloader-bar 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes preloader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes preloader-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.5; }
        50% { transform: scale(1.25); opacity: 0.9; }
      }

      @keyframes preloader-zoom {
        0% { transform: scale(0.97); }
        100% { transform: scale(1.03); }
      }

      @keyframes preloader-bar {
        0% { left: -45%; }
        100% { left: 105%; }
      }

    <!-- 🛡️ SCRIPT ANTI-BARRE FLUIDE (Ne bloque pas la traduction) -->
    <script>
      const observer = new MutationObserver(() => {
        // Force le body à ne jamais descendre à cause de la barre Google
        if (document.body.style.top !== '0px' && document.body.style.top !== '') {
          document.body.style.top = '0px';
        }
        // Masque à la volée la structure de la bannière si elle s'injecte
        const frame = document.querySelector('.goog-te-banner-frame');
        if (frame) {
          frame.style.display = 'none';
          frame.style.visibility = 'hidden';
        }
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'], childList: true, subtree: true });
    </script>
